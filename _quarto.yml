project:
  type: website
  output-dir: _site
  # Only pages: keeps docs/, src/, and tests/ out of the site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "memexponent | Prototyping, Upskilling, & Engineering with AI"
  site-url: https://memexponent.net
  navbar:
    right:
      - charter.qmd
      - about.qmd
      - icon: github
        href: https://github.com/crossjam
      - icon: linkedin
        href: https://linkedin.com/in/crossjam

  draft-mode: visible
  
format:
  html:
    theme:
      - minty
      - cosmo
      - brand
    css: styles.css



filters:
  - grab.lua

